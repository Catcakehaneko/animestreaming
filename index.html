<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISTR3AM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Force text wrapping on card titles globally */
        .card-title {
            display: -webkit-box;
            -webkit-line-clamp: unset !important;
            -webkit-box-orient: vertical;
            overflow: visible !important;
            text-overflow: clip !important;
            white-space: normal !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 p-4 flex flex-col sm:flex-row justify-between items-center bg-slate-900 gap-4">
        <div class="flex items-center gap-6">
            <h1 class="text-xl font-bold text-red-500 cursor-pointer tracking-wider" onclick="loadHome()">HISTR3AM</h1>
            <nav class="flex gap-4 text-sm text-slate-300">
                <button onclick="loadHome()" class="hover:text-white transition">Home</button>
                <button onclick="loadHome()" class="hover:text-white transition">Recent Uploads</button>
            </nav>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <input type="text" id="searchInput" placeholder="Search anime..." onkeydown="if(event.key === 'Enter') handleSearch()" class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-red-500 w-full sm:w-80">
            <button onclick="handleSearch()" class="bg-red-500 px-5 py-2 rounded-full text-sm font-semibold hover:bg-red-600 transition">Search</button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full" id="mainContainer">
        <!-- Dynamic content injected via app.js -->
        <div class="text-center py-20 text-slate-400">Loading catalog...</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
